<!doctype html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Kawai Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style type="text/css">
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body>

<script type="text/javascript">

var config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    //  Allow several fingers at once, so you can move and jump at the same time
    input: {
        activePointers: 3
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

var player;
var bad_guy;
var stars;
var bombs;
var brocolis;
var platforms;
var cursors;
var score = 0;
var level = 1;
var gameOver = false;
var scoreText;
var background;
var touch = { left: false, right: false, jump: false };

//  The bad guy walks back and forth on the highest ledge (x 531 -> 969, top at y 204)
var BAD_GUY_SPAWN_X = 770;
var BAD_GUY_SPAWN_Y = 150;
var BAD_GUY_MIN_X = 560;
var BAD_GUY_MAX_X = 770;
var BAD_GUY_SPEED = 80;

var game = new Phaser.Game(config);

function preload ()
{
    this.load.image('sky', 'assets/pink-sky.jpg');
    this.load.audio('erin', 'assets/erin_fall.mp3');
    this.load.audio('phou', 'assets/phou.mp3');
    this.load.audio('laugh', 'assets/chloe_laugh.mp3');
    this.load.image('ground', 'assets/platform.png');
    this.load.image('platform', 'assets/doughnut_platform.png');
    this.load.image('star', 'assets/doughnut.png');
    this.load.image('bomb', 'assets/bomb.png');
    this.load.image('baddie', 'assets/bad.png');
    this.load.image('brocoli', 'assets/brocoli.png');
    this.load.spritesheet('dude', 'assets/super_kawai_2.png', { frameWidth: 64, frameHeight: 64 });
}

function create ()
{
    //  Reset the state, globals survive a scene restart
    score = 0;
    level = 1;
    gameOver = false;
    touch = { left: false, right: false, jump: false };

    //  A simple background for our game
    background = this.add.image(400, 300, 'sky');
    background.setScale(0.25);

    //  The platforms group contains the ground and the 2 ledges we can jump on
    platforms = this.physics.add.staticGroup();

    //  Here we create the ground.
    //  Scale it to fit the width of the game (the original sprite is 400x32 in size)
    platforms.create(400, 568, 'platform').setScale(1.5).refreshBody();

    //  Now let's create some ledges
    //  Each ledge is a chain of 3 doughnuts (~440px wide, close to the original 400px)
    createDoughnutLedge(600, 400, 3);
    // platforms.create(600, 400, 'ground');
    createDoughnutLedge(50, 250, 3);
    createDoughnutLedge(750, 220, 3);

    // The player and its settings
    player = this.physics.add.sprite(100, 450, 'dude');
    //  Frames are 64x64: keep native size and fit the hitbox to the visible character
    player.setScale(1);
    player.body.setSize(29, 48);
    player.body.setOffset(17, 16);

    //  Player physics properties. Give the little guy a slight bounce.
    player.setBounce(0.2);
    player.setCollideWorldBounds(true);

    //  The bad guy starts at the far right of the highest ledge and walks left
    bad_guy = this.physics.add.sprite(BAD_GUY_SPAWN_X, BAD_GUY_SPAWN_Y, 'baddie');

    bad_guy.setScale(1.5);
    bad_guy.body.setSize(29, 48);
    bad_guy.body.setOffset(17, 16);

    bad_guy.setBounce(0);
    bad_guy.setCollideWorldBounds(true);
    //  The player can't shove him off the ledge, but he still lands on the platforms
    bad_guy.body.pushable = false;
    bad_guy.setVelocityX(-BAD_GUY_SPEED);
    bad_guy.setFlipX(false);

    //  Our player animations, turning, walking left and walking right.
    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
        frameRate: 10,
        repeat: -1
    });

    this.anims.create({
        key: 'turn',
        frames: [ { key: 'dude', frame: 4 } ],
        frameRate: 20
    });

    this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
        frameRate: 10,
        repeat: -1
    });

    //  Input Events
    cursors = this.input.keyboard.createCursorKeys();

    //  On-screen buttons, only on touch devices
    if (this.sys.game.device.input.touch)
    {
        addTouchButton(this, 70, 530, '◀', 'left');
        addTouchButton(this, 180, 530, '▶', 'right');
        addTouchButton(this, 730, 530, '▲', 'jump');
    }

    //  Some stars to collect, 12 in total, evenly spaced 70 pixels apart along the x axis
    stars = this.physics.add.group({
        key: 'star',
        repeat: 11,
        setXY: { x: 12, y: 0, stepX: 70 }
    });

    stars.children.iterate(function (child) {

        //  Give each star a slightly different bounce
        child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));

    });

    bombs = this.physics.add.group();

    //  Brocolis shot by the bad guy every 5 seconds
    brocolis = this.physics.add.group();

    this.time.addEvent({ delay: 5000, loop: true, callback: shootBrocoli, callbackScope: this });

    //  Only brocolis report hitting the world bounds: remove them at the screen edges
    this.physics.world.on('worldbounds', function (body) {
        body.gameObject.destroy();
    });

    //  The score
    scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000' });

    //  Collide the player and the stars with the platforms
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(stars, platforms);
    this.physics.add.collider(bombs, platforms);
    this.physics.add.collider(bad_guy, platforms);
    this.physics.add.collider(brocolis, platforms);

    //  Checks to see if the player overlaps with any of the stars, if he does call the collectStar function
    this.physics.add.overlap(player, stars, collectStar, null, this);

    this.physics.add.collider(player, bombs, hitBomb, null, this);
    this.physics.add.collider(player, brocolis, hitBomb, null, this);
    this.physics.add.collider(player, bad_guy, hitBadGuy, null, this);
}

function update ()
{
    if (gameOver)
    {
        return;
    }

    if (cursors.left.isDown || touch.left)
    {
        player.setVelocityX(-160);

        player.anims.play('left', true);
    }
    else if (cursors.right.isDown || touch.right)
    {
        player.setVelocityX(160);

        player.anims.play('right', true);
    }
    else
    {
        player.setVelocityX(0);

        player.anims.play('turn');
    }

    if ((cursors.up.isDown || touch.jump) && player.body.touching.down)
    {
        player.setVelocityY(-330);
    }

    //  Turn around at the ends of the ledge, facing the walking direction
    if (bad_guy.active)
    {
        if (bad_guy.x <= BAD_GUY_MIN_X)
        {
            bad_guy.setVelocityX(BAD_GUY_SPEED);
            bad_guy.setFlipX(true);
        }
        else if (bad_guy.x >= BAD_GUY_MAX_X)
        {
            bad_guy.setVelocityX(-BAD_GUY_SPEED);
            bad_guy.setFlipX(false);
        }
    }
}

//  Chains `count` doughnuts side by side, centred on x
//  The doughnut sprite is 512x112: scale it down to the original 32px platform height
function createDoughnutLedge (x, y, count)
{
    var scale = 32 / 112;
    var width = 512 * scale;
    var startX = x - (width * (count - 1)) / 2;

    for (var i = 0; i < count; i++)
    {
        platforms.create(startX + i * width, y, 'platform').setScale(scale).refreshBody();
    }
}

function collectStar (player, star)
{
    star.disableBody(true, true);

    //  Add and update the score
    score += 10;
    scoreText.setText('Score: ' + score);

    if (stars.countActive(true) === 0)
    {
        this.sound.play('laugh');
        //  Next level: a new batch of stars to collect
        level++;

        stars.children.iterate(function (child) {

            child.enableBody(true, child.x, 0, true, true);

        });

        var x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

        var bomb = bombs.create(x, 16, 'bomb');
        bomb.setBounce(1);
        bomb.setCollideWorldBounds(true);
        bomb.setVelocity(Phaser.Math.Between(-200, 200), 20);
        bomb.body.allowGravity = false;

        //  Bring the bad guy back if he was stomped
        if (!bad_guy.active)
        {
            bad_guy.enableBody(true, BAD_GUY_SPAWN_X, BAD_GUY_SPAWN_Y, true, true);
            bad_guy.setVelocityX(-BAD_GUY_SPEED);
            bad_guy.setFlipX(false);
        }

    } else {
        
        this.sound.play('erin');
    }
}

function shootBrocoli ()
{
    if (gameOver || !bad_guy.active)
    {
        return;
    }

    //  One brocoli per level, 1 second apart
    for (var i = 0; i < level; i++)
    {
        this.time.delayedCall(i * 1000, fireBrocoli, null, this);
    }
}

function fireBrocoli ()
{
    if (gameOver || !bad_guy.active)
    {
        return;
    }

    //  Shoot towards the player's side
    var dir = (player.x < bad_guy.x) ? -1 : 1;

    var brocoli = brocolis.create(bad_guy.x + dir * 30, bad_guy.y, 'brocoli');
    brocoli.setScale(2);
    brocoli.setBounce(0.8);
    brocoli.setVelocity(dir * 200, -150);
    brocoli.setCollideWorldBounds(true);
    brocoli.body.onWorldBounds = true;
}

function hitBadGuy (player, bad_guy)
{
    //  Landing on his head gets rid of him, any other contact is game over
    if (player.body.touching.down && bad_guy.body.touching.up)
    {
        bad_guy.disableBody(true, true);
        player.setVelocityY(-250);
    }
    else
    {
        hitBomb.call(this, player, bad_guy);
    }
}

function hitBomb (player, bomb)
{
    this.physics.pause();

    this.sound.play('phou');

    player.setTint(0xff0000);

    player.anims.play('turn');

    gameOver = true;

    this.add.text(400, 300, 'Game over, tap to restart', { fontSize: '40px', fill: '#000' })
        .setOrigin(0.5)
        .setDepth(10);

    var scene = this;
    this.input.once('pointerdown', function () { scene.scene.restart(); });
    this.input.keyboard.once('keydown-SPACE', function () { scene.scene.restart(); });
}

function addTouchButton (scene, x, y, label, key)
{
    var button = scene.add.rectangle(x, y, 90, 90, 0xffffff, 0.35)
        .setStrokeStyle(2, 0x000000, 0.5)
        .setDepth(10)
        .setInteractive();

    scene.add.text(x, y, label, { fontSize: '40px', fill: '#000' })
        .setOrigin(0.5)
        .setDepth(11);

    button.on('pointerdown', function () {
        touch[key] = true;
        button.setFillStyle(0xffffff, 0.6);
    });

    var release = function () {
        touch[key] = false;
        button.setFillStyle(0xffffff, 0.35);
    };
    button.on('pointerup', release);
    button.on('pointerout', release);
}

</script>

</body>
</html>
