<!doctype html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Making your first Phaser 3 Game - Part 10</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style type="text/css">
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body>

<script type="text/javascript">

var config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    //  Allow several fingers at once, so you can move and jump at the same time
    input: {
        activePointers: 3
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

var player;
var stars;
var bombs;
var platforms;
var cursors;
var score = 0;
var gameOver = false;
var scoreText;
var touch = { left: false, right: false, jump: false };

var game = new Phaser.Game(config);

function preload ()
{
    this.load.image('sky', 'assets/sky.png');
    this.load.audio('erin', 'assets/erin_fall.mp3');
    this.load.audio('phou', 'assets/phou.mp3');
    this.load.audio('laugh', 'assets/chloe_laugh.mp3');
    this.load.image('ground', 'assets/platform.png');
    this.load.image('star', 'assets/star.png');
    this.load.image('bomb', 'assets/bomb.png');
    this.load.spritesheet('dude', 'assets/super_kawai_2.png', { frameWidth: 64, frameHeight: 64 });
}

function create ()
{
    //  Reset the state, globals survive a scene restart
    score = 0;
    gameOver = false;
    touch = { left: false, right: false, jump: false };

    //  A simple background for our game
    this.add.image(400, 300, 'sky');

    //  The platforms group contains the ground and the 2 ledges we can jump on
    platforms = this.physics.add.staticGroup();

    //  Here we create the ground.
    //  Scale it to fit the width of the game (the original sprite is 400x32 in size)
    platforms.create(400, 568, 'ground').setScale(2).refreshBody();

    //  Now let's create some ledges
    platforms.create(600, 400, 'ground');
    platforms.create(50, 250, 'ground');
    platforms.create(750, 220, 'ground');

    // The player and its settings
    player = this.physics.add.sprite(100, 450, 'dude');
    //  Frames are 64x64: keep native size and fit the hitbox to the visible character
    player.setScale(1);
    player.body.setSize(29, 48);
    player.body.setOffset(17, 16);

    //  Player physics properties. Give the little guy a slight bounce.
    player.setBounce(0.2);
    player.setCollideWorldBounds(true);

    //  Our player animations, turning, walking left and walking right.
    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
        frameRate: 10,
        repeat: -1
    });

    this.anims.create({
        key: 'turn',
        frames: [ { key: 'dude', frame: 4 } ],
        frameRate: 20
    });

    this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
        frameRate: 10,
        repeat: -1
    });

    //  Input Events
    cursors = this.input.keyboard.createCursorKeys();

    //  On-screen buttons, only on touch devices
    if (this.sys.game.device.input.touch)
    {
        addTouchButton(this, 70, 530, '◀', 'left');
        addTouchButton(this, 180, 530, '▶', 'right');
        addTouchButton(this, 730, 530, '▲', 'jump');
    }

    //  Some stars to collect, 12 in total, evenly spaced 70 pixels apart along the x axis
    stars = this.physics.add.group({
        key: 'star',
        repeat: 11,
        setXY: { x: 12, y: 0, stepX: 70 }
    });

    stars.children.iterate(function (child) {

        //  Give each star a slightly different bounce
        child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));

    });

    bombs = this.physics.add.group();

    //  The score
    scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000' });

    //  Collide the player and the stars with the platforms
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(stars, platforms);
    this.physics.add.collider(bombs, platforms);

    //  Checks to see if the player overlaps with any of the stars, if he does call the collectStar function
    this.physics.add.overlap(player, stars, collectStar, null, this);

    this.physics.add.collider(player, bombs, hitBomb, null, this);
}

function update ()
{
    if (gameOver)
    {
        return;
    }

    if (cursors.left.isDown || touch.left)
    {
        player.setVelocityX(-160);

        player.anims.play('left', true);
    }
    else if (cursors.right.isDown || touch.right)
    {
        player.setVelocityX(160);

        player.anims.play('right', true);
    }
    else
    {
        player.setVelocityX(0);

        player.anims.play('turn');
    }

    if ((cursors.up.isDown || touch.jump) && player.body.touching.down)
    {
        player.setVelocityY(-330);
    }
}

function collectStar (player, star)
{
    star.disableBody(true, true);

    //  Add and update the score
    score += 10;
    scoreText.setText('Score: ' + score);

    if (stars.countActive(true) === 0)
    {
        this.sound.play('laugh');
        //  A new batch of stars to collect
        stars.children.iterate(function (child) {

            child.enableBody(true, child.x, 0, true, true);

        });

        var x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);

        var bomb = bombs.create(x, 16, 'bomb');
        bomb.setBounce(1);
        bomb.setCollideWorldBounds(true);
        bomb.setVelocity(Phaser.Math.Between(-200, 200), 20);
        bomb.body.allowGravity = false;

    } else {
        
        this.sound.play('erin');
    }
}

function hitBomb (player, bomb)
{
    this.physics.pause();

    this.sound.play('phou');

    player.setTint(0xff0000);

    player.anims.play('turn');

    gameOver = true;

    this.add.text(400, 300, 'Game over, tap to restart', { fontSize: '40px', fill: '#000' })
        .setOrigin(0.5)
        .setDepth(10);

    var scene = this;
    this.input.once('pointerdown', function () { scene.scene.restart(); });
    this.input.keyboard.once('keydown-SPACE', function () { scene.scene.restart(); });
}

function addTouchButton (scene, x, y, label, key)
{
    var button = scene.add.rectangle(x, y, 90, 90, 0xffffff, 0.35)
        .setStrokeStyle(2, 0x000000, 0.5)
        .setDepth(10)
        .setInteractive();

    scene.add.text(x, y, label, { fontSize: '40px', fill: '#000' })
        .setOrigin(0.5)
        .setDepth(11);

    button.on('pointerdown', function () {
        touch[key] = true;
        button.setFillStyle(0xffffff, 0.6);
    });

    var release = function () {
        touch[key] = false;
        button.setFillStyle(0xffffff, 0.35);
    };
    button.on('pointerup', release);
    button.on('pointerout', release);
}

</script>

</body>
</html>
